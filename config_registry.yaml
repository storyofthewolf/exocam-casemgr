# ExoCAM config registry
# Edit paths for your machine before use.
# This is the single authoritative source for:
#   - machine paths
#   - IC file -> (config_type, pressure, levels) mapping
#   - CESM create_newcase parameters per config type
#
# pressure keys must exactly match substrings in IC filenames (e.g. "1bar", "0.1bar")
# level keys are integers matching the L<N> in IC filenames and -nlev in CAM_CONFIG_OPTS

machine: discover

# Default run parameters — applied to any experiment matrix field left unset.
# Override per-matrix in the base block or per-case.
defaults:
  resubmit:    0
  stop_option: nyears
  stop_n:      10
  rest_option: nyears
  rest_n:      10
  ntasks:      126
  account:     s2427

paths:
  cesm_scripts: /gpfsm/dnb33/etwolf/models/cesm1_2_1/scripts
  caseroot:     /gpfsm/dnb33/etwolf/cesm_scratch/cases
  rundir:       /gpfsm/dnb33/etwolf/cesm_scratch/rundir
  archive:      /gpfsm/dnb33/etwolf/cesm_scratch/archive
  long_term:    /gpfsm/dnb07/projects/p54/users/etwolf/exocam-archive
  exocam_root:  /gpfsm/dnb33/etwolf/models/ExoCAM
  exort_root:   /gpfsm/dnb33/etwolf/models/ExoRT
  # Generated inputs (build.py prep): products of Chain A (star -> solar file ->
  # cice albedos) and Chain B (ic_template -> ncdata) live here, never inside
  # the ExoCAM/ExoRT checkouts. Subdirs solar/, albedo/, ic/<config_type>/.
  #
  # p54, NOT cesm_scratch (owner decision 2026-09-18). These products are cheap
  # to regenerate, but they are live inputs to running cases and each carries a
  # .prep.yaml manifest recording engine git SHAs -- an archival artifact. A
  # scratch purge mid-run would be costly; p54 is durable and holds the grid.
  generated_inputs: /gpfsm/dnb07/projects/p54/users/etwolf/generated_inputs
  # stellar-interpolator checkout (code only; ~300 MB, dhome has a 1 GB quota).
  stellar_interpolator: /gpfsm/dhome/etwolf/pythonWorkspace/stellar-interpolator
  # BT-Settl grid: 3.8 GB / 332 lte*.dat.txt files, too big for dhome, so it
  # does NOT sit under <stellar_interpolator>/grid and this override is required.
  # SpectralGrid.from_dir globs 'lte*.dat.txt' recursively, so layout is flexible.
  btsettl_grid: /gpfsm/dnb07/projects/p54/users/etwolf/btsettl_grid
  # exocam_py_progs / exort_tools default to <exocam_root>/tools/py_progs and
  # <exort_root>/tools; set only to point elsewhere.

# exort_pkg -> substring that must appear in the solar filename basename
solar_file_stems:
  n68equiv:   n68
  n84equiv:   n84
  n28archean: n28
  n42h2o:     n42

# CESM create_newcase parameters per config type
cesm_config:
  cam_aqua_fv:
    res:      f45_f45
    compset:  E2000C4AQI
    phys:     cam4
  cam_land_fv:
    res:      f45_f45
    compset:  L2000
    phys:     cam4
  cam_mixed_fv:
    res:      f45_g37
    compset:  E2000C4
    phys:     cam4
  cam_aqua_se_ne5:
    res:      ne5np4_ne5np4
    compset:  E2000C4AQI
    phys:     cam4
  cam_aqua_se_ne16:
    res:      ne16np4_ne16np4
    compset:  E2000C4AQI
    phys:     cam4

# IC templates for build.py prep (Chain B). A matrix `ic_template: <tag>` makes
# ncdata from the named file at the case's pstd (flat PS field, IDL
# changepress_cesm.pro semantics), nlev (levels cut from the 66-level WACCM
# grid when they differ) and ic_dry. Values are relative to
# {exocam_root}/cesm1.2.1/initial_files/ or absolute. The tag is part of the
# product name (ic_<tag>_<P>bar_L<nlev>[_dry]_ic.nc), so keep tags short and
# never reuse one for a different file.
ic_templates:
  ctrl40:  cam_aqua_fv/control_L40.cam.i.0009-01-01-00000.nc   # source of every ic_*bar_L40* file
  ctrl45:  cam_aqua_fv/control_L45.cam.i.0040-01-01-00000.nc
  ctrl48:  cam_aqua_fv/control_L48.cam.i.0048-01-01-00000.nc
  ctrl51:  cam_aqua_fv/control_L51.cam.i.nc
  land40:  cam_land_fv/control_L40_dry.cam.i.nc

# IC file table.
# These are the files present in cesm1.2.1/initial_files/<config_type>/
# Filename only — prepend {paths.exocam_root}/cesm1.2.1/initial_files/<config_type>/
# Add entries as you add IC files to the repo.

ic_files:
  cam_aqua_fv:
    "0.0065bar":
      40: ic_0.0065bar_L40_dry_ic.nc
    "0.01bar":
      40: ic_0.01bar_L40_ic.nc
      46: ic_0.01bar_L46_300Kiso_dry_ic.nc
    "0.1bar":
      40: ic_0.1bar_L40_dry_ic.nc
      46: ic_0.1bar_L46_300Kiso_dry_ic.nc
    "0.25bar":
      40: ic_0.25bar_L40_ic.nc
      51: ic_0.25bar_L51_eyeball_ic.nc
    "0.5bar":
      40: ic_0.5bar_L40_ic.nc
      51: ic_0.5bar_L51_zmean_ic.nc
    "1bar":
      40: ic_1bar_L40_zmean_ic.nc
      46: ic_1bar_L46_300Kiso_dry_ic.nc
      51: ic_1bar_L51_zmean_ic.nc
    "1.1bar":
      40: ic_1.1bar_L40_ic.nc
      51: ic_1.1bar_L51_zmean_ic.nc
    "1.2bar":
      40: ic_1.2bar_L40_ic.nc
      51: ic_1.2bar_L51_zmean_ic.nc
    "1.4bar":
      40: ic_1.4bar_L40_ic.nc
    "1.5bar":
      51: ic_1.5bar_L51_dry_ic.nc
    "1.6bar":
      40: ic_1.6bar_L40_ic.nc
    "2bar":
      40: ic_2bar_L40_ic.nc
      51: ic_2bar_L51_zmean_ic.nc
    "2.3bar":
      40: ic_2.3bar_L40_300Kiso_ic.nc
    "4bar":
      40: ic_4bar_L40_ic.nc
      51: ic_4bar_L51_eyeball_ic.nc
    "4.1bar":
      40: ic_4.1bar_L40_ic.nc
    "5bar":
      40: ic_5bar_L40_ic.nc
    "6bar":
      40: ic_6bar_L40_dry_ic.nc
    "8bar":
      40: ic_8bar_L40_dry_ic.nc
    "10bar":
      40: ic_10bar_L40_ic.nc
      51: ic_10bar_L51_zmean_ic.nc
    "10.2bar":
      40: ic_10.2bar_L40_ic.nc
    "100bar":
      51: ic_100bar_L51_iso300_ic.nc

  cam_land_fv:
    "1bar":
      40: control_L40_dry.cam.i.nc
      51: ic_1bar_L51_zmean_dry_ic.nc
    "4bar":
      51: ic_4bar_L51_eyeball_dry_ic.nc
    "10bar":
      51: ic_10bar_L51_zmean_dry_ic.nc

  cam_mixed_fv:
    # mixed config uses cam_aqua_fv ICs for atmosphere; add here if different
    "1bar":
      51: control_L51.cam.i.nc

  cam_aqua_se_ne5:
    "1bar":
      30: cami_0000-01-01_ne5np4_L30_ape_c101201_aquaplanet.nc

  cam_aqua_se_ne16:
    "1bar":
      26: cami_0000-01-01_ne16np4_L26_c120525_aquaplanet.nc
      40: cami_0000-01-01_ne16np4_L40_c120525_aquaplanet.nc
      48: cami_0000-01-01_ne16np4_L48_c120525_aquaplanet.nc
